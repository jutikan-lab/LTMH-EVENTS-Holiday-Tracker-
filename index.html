<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Prompt', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const Icon = ({ name, className = "" }) => {
            const hasWidth = /\bw-\d+/.test(className) || className.includes('w-full') || className.includes('w-auto');
            const hasHeight = /\bh-\d+/.test(className) || className.includes('h-full') || className.includes('h-auto');
            const sizeDefault = (!hasWidth || !hasHeight) ? 'w-4 h-4' : '';
            const finalClassName = `${className} ${sizeDefault}`.trim();
            const svgProps = {
                className: finalClassName,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round"
            };
            const paths = {
                Plus: <><path d="M5 12h14"/><path d="M12 5v14"/></>,
                Calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
                Clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
                Trash2: <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
                FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></>,
                LayoutDashboard: <><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></>,
                Lock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
                Unlock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></>,
                Edit2: <><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></>,
                Check: <><polyline points="20 6 9 17 4 12"/></>,
                UserPlus: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></>,
                UserMinus: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" x2="16" y1="11" y2="11"/></>,
                ShieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></>,
                Calculator: <><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></>,
                ArrowRight: <><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></>,
                ListChecks: <><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></>,
                ChevronRight: <><polyline points="9 18 15 12 9 6"/></>,
                ArrowLeft: <><path d="M19 12h-14"/><polyline points="12 19 5 12 12 5"/></>,
                PieChart: <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>,
                KeyRound: <><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4c.9.4 1.8.4 2.6 0l4.7-4.7c.7-.7.7-1.9 0-2.6l-2.1-2.1c-.7-.7-1.9-.7-2.6 0L12.3 11.3c-.4.8-.4 1.7 0 2.6L11 15.3V18H2z"/><circle cx="17.5" cy="7.5" r=".5" fill="currentColor"/></>,
                History: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></>,
                Briefcase: <><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>,
                // FIX: Settings icon was used in nav but missing from paths
                Settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>
            };
            return (
                <svg {...svgProps}>
                    {paths[name] || null}
                </svg>
            );
        };
        const DEFAULT_LABELS = {
            appTitle: "Holiday Tracker Pro",
            subTitle: "ระบบจัดการวันหยุดชดเชยและการปฏิบัติงานในวันหยุด",
            tabDashboard: "หน้าหลัก",
            tabHistory: "ประวัติรวม",
            tabRequest: "แจ้งวันหยุด",
            tabManage: "จัดการระบบ",
            cardTotalStaff: "สมาชิกในทีม",
            cardPending: "รอตรวจสอบ",
            cardUsed: "ใช้ไปแล้วรวม",
            tableTitle: "สรุปสิทธิ์วันลาคงเหลือ",
            colName: "รายชื่อพนักงาน",
            colEarned: "สิทธิ์สะสม (วัน)",
            colUsed: "ใช้แล้ว (วัน)",
            colRemaining: "คงเหลือ (วัน)",
            historyTitle: "ประวัติการปฏิบัติงานทั้งหมด",
            requestTitle: "แจ้งความประสงค์ลาหยุดชดเชย",
            btnSubmitRequest: "ส่งข้อมูลตรวจสอบ",
            statusPending: "รอตรวจสอบ",
            statusApproved: "ยืนยันแล้ว",
            statusRejected: "ปฏิเสธ",
            manageSectionWork: "บันทึกงาน (เพิ่มสิทธิ์)",
            manageSectionApproval: "ตรวจสอบรายการแจ้งลา",
            manageSectionTeam: "จัดการสมาชิกในทีม",
            manageSectionSecurity: "ความปลอดภัย (เปลี่ยนรหัส)",
            addWorkPlaceholder: "ระบุชื่องาน/โปรเจกต์",
            addMemberPlaceholder: "ระบุชื่อพนักงานใหม่",
            btnAddWork: "บันทึกสิทธิ์ลงระบบ",
            btnAddMember: "เพิ่มเข้าสู่ทีม",
            labelSelectProject: "เลือกโปรเจกต์ที่จะใช้สิทธิ์ (ระบบจะไล่หักแบบ FIFO)",
            labelAmountToUse: "ต้องการลาหยุดกี่วัน?",
            labelTotalRemaining: "ยอดคงเหลือรวมทุกโปรเจกต์",
            labelDeductionPlan: "สรุปแผนการหักยอดอัตโนมัติ",
            labelDetailView: "รายละเอียดสิทธิ์รายบุคคล",
            labelBackToDashboard: "กลับหน้าหลัก",
            labelProjectSummary: "สรุปตามโปรเจกต์ที่ปฏิบัติงาน",
            labelOldPass: "รหัสผ่านเดิม",
            labelNewPass: "รหัสผ่านใหม่ (4 หลัก)",
            labelConfirmPass: "ยืนยันรหัสผ่านใหม่",
            btnChangePass: "บันทึกรหัสผ่านใหม่"
        };
        const App = () => {
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem('holiday_admin_password') || '1234');
            const [showToast, setShowToast] = useState(null);
            const [uiLabels, setUiLabels] = useState(() => {
                try {
                    const saved = localStorage.getItem('holiday_ui_labels');
                    // Merge saved labels with defaults so new keys always exist
                    return saved ? { ...DEFAULT_LABELS, ...JSON.parse(saved) } : DEFAULT_LABELS;
                } catch (e) { return DEFAULT_LABELS; }
            });
            const [employees, setEmployees] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('holiday_employees')) || [
                        { id: 1, name: 'สมชาย ตั้งใจทำงาน' },
                        { id: 2, name: 'วีรยา รักดี' },
                        { id: 3, name: 'ธนากร เรียนรู้' }
                    ];
                } catch (e) { return []; }
            });
            const [earnedLogs, setEarnedLogs] = useState(() => {
                try { return JSON.parse(localStorage.getItem('holiday_earned_logs')) || []; } catch (e) { return []; }
            });
            const [usageLogs, setUsageLogs] = useState(() => {
                try { return JSON.parse(localStorage.getItem('holiday_usage_logs')) || []; } catch (e) { return []; }
            });
            // FIX: uiLabels added to persistence effect
            useEffect(() => {
                localStorage.setItem('holiday_employees', JSON.stringify(employees));
                localStorage.setItem('holiday_earned_logs', JSON.stringify(earnedLogs));
                localStorage.setItem('holiday_usage_logs', JSON.stringify(usageLogs));
                localStorage.setItem('holiday_admin_password', adminPassword);
                localStorage.setItem('holiday_ui_labels', JSON.stringify(uiLabels));
            }, [employees, earnedLogs, usageLogs, adminPassword, uiLabels]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedUserDetail, setSelectedUserDetail] = useState(null);
            const [selectedEmpForRequest, setSelectedEmpForRequest] = useState("");
            const [selectedProjects, setSelectedProjects] = useState([]);
            const [requestDays, setRequestDays] = useState(1);
            const [startDate, setStartDate] = useState("");
            const displayToast = (msg) => {
                setShowToast(msg);
                setTimeout(() => setShowToast(null), 3000);
            };
            const [editingKey, setEditingKey] = useState(null);
            const [editValue, setEditValue] = useState('');
            const saveLabel = (key, value) => {
                setUiLabels(prev => ({ ...prev, [key]: value }));
                setEditingKey(null);
            };
            const EditableText = ({ id, className = "" }) => {
                const isEditing = editingKey === id;
                const currentVal = uiLabels[id] ?? id;
                if (isEditing) {
                    return (
                        <div className="inline-flex items-center gap-1" onClick={(e) => e.stopPropagation()}>
                            <input
                                className="border-b-2 border-indigo-500 bg-indigo-50 outline-none px-1 rounded text-slate-900 font-medium min-w-[100px]"
                                value={editValue}
                                onChange={(e) => setEditValue(e.target.value)}
                                autoFocus
                                onKeyDown={(e) => e.key === 'Enter' && saveLabel(id, editValue)}
                            />
                            <span role="button" onClick={(e) => { e.stopPropagation(); saveLabel(id, editValue); }} className="text-emerald-500 p-1 cursor-pointer">
                                <Icon name="Check" className="w-4 h-4" />
                            </span>
                        </div>
                    );
                }
                return (
                    <span className={`group relative inline-flex items-center gap-2 ${className}`}>
                        {currentVal}
                        {isAdmin && (
                            <span role="button" onClick={(e) => { e.stopPropagation(); setEditValue(currentVal); setEditingKey(id); }} className="opacity-0 group-hover:opacity-100 text-indigo-400 p-0.5 cursor-pointer inline-flex items-center">
                                <Icon name="Edit2" className="w-3 h-3" />
                            </span>
                        )}
                    </span>
                );
            };
            // --- Business Logic ---
            const getProjectBalances = (empId) => {
                if (!empId) return [];
                return earnedLogs.filter(log => log.empId === parseInt(empId)).map(log => {
                    const used = usageLogs
                        .filter(u => u.status === 'Approved')
                        .reduce((sum, u) => sum + (u.deductions?.[log.id] || 0), 0);
                    return { ...log, usedInProject: used, remainingInProject: log.days - used };
                });
            };
            const toggleProjectSelection = (id) => {
                setSelectedProjects(prev => prev.includes(id) ? prev.filter(p => p !== id) : [...prev, id]);
            };
            const deductionPlan = useMemo(() => {
                if (!selectedEmpForRequest || selectedProjects.length === 0 || !requestDays || requestDays <= 0) {
                    return { plan: [], insufficient: false };
                }
                let remaining = parseFloat(requestDays);
                const plan = [];
                const available = getProjectBalances(selectedEmpForRequest).filter(p => selectedProjects.includes(p.id) && p.remainingInProject > 0);
                const sorted = selectedProjects.map(id => available.find(p => p.id === id)).filter(Boolean);
                sorted.forEach(proj => {
                    if (remaining <= 0) return;
                    const deduct = Math.min(remaining, proj.remainingInProject);
                    plan.push({ id: proj.id, name: proj.reason, deduct, remainingAfter: proj.remainingInProject - deduct });
                    remaining -= deduct;
                });
                return { plan, insufficient: remaining > 0 };
            }, [selectedEmpForRequest, selectedProjects, requestDays, earnedLogs, usageLogs]);
            const summaryData = useMemo(() => employees.map(emp => {
                const earned = earnedLogs.filter(log => log.empId === emp.id).reduce((sum, log) => sum + log.days, 0);
                const used = usageLogs.filter(log => log.empId === emp.id && log.status === 'Approved').reduce((sum, l) => sum + (l.daysUsed || 0), 0);
                return { ...emp, earned, used, remaining: earned - used, pending: usageLogs.filter(log => log.empId === emp.id && log.status === 'Pending').length };
            }), [employees, earnedLogs, usageLogs]);
            const calculatedEndDate = useMemo(() => {
                if (!startDate || !requestDays || requestDays <= 0) return "";
                const date = new Date(startDate);
                date.setDate(date.getDate() + (Math.ceil(parseFloat(requestDays)) - 1));
                return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
            }, [startDate, requestDays]);
            // --- Handlers ---
            const handlePassChange = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                if (formData.get('oldPass') !== adminPassword) { displayToast("รหัสเดิมไม่ถูกต้อง"); return; }
                const newP = formData.get('newPass');
                if (newP.length !== 4 || isNaN(newP)) { displayToast("รหัสต้องเป็นเลข 4 หลัก"); return; }
                if (newP !== formData.get('confirmPass')) { displayToast("รหัสยืนยันไม่ตรงกัน"); return; }
                setAdminPassword(newP);
                displayToast("เปลี่ยนรหัสผ่านสำเร็จ");
                e.target.reset();
            };
            const addEarnedLog = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const empSelection = formData.get('empId');
                const reason = formData.get('reason');
                const date = formData.get('date');
                const days = parseFloat(formData.get('days'));
                const timestamp = Date.now();
                if (empSelection === 'all') {
                    const newLogs = employees.map((emp, index) => ({ id: `earned-${timestamp}-${emp.id}-${index}`, empId: emp.id, date, reason, days }));
                    setEarnedLogs(prev => [...prev, ...newLogs]);
                } else {
                    setEarnedLogs(prev => [...prev, { id: `earned-${timestamp}-${empSelection}`, empId: parseInt(empSelection), date, reason, days }]);
                }
                displayToast("บันทึกสิทธิ์สำเร็จ");
                e.target.reset();
            };
            const addUsageLog = (e) => {
                e.preventDefault();
                if (deductionPlan.insufficient) { displayToast("สิทธิ์ไม่พอ"); return; }
                const deductionsMap = {};
                deductionPlan.plan.forEach(item => { deductionsMap[item.id] = item.deduct; });
                const formData = new FormData(e.target);
                setUsageLogs(prev => [...prev, {
                    id: Date.now(),
                    empId: parseInt(selectedEmpForRequest),
                    sourceProjectName: deductionPlan.plan.map(p => `${p.name} (-${p.deduct})`).join(', '),
                    deductions: deductionsMap,
                    daysUsed: parseFloat(requestDays),
                    date: formData.get('date'),
                    endDate: calculatedEndDate,
                    note: formData.get('note') || '',   // FIX: note field now wired up
                    status: 'Pending'
                }]);
                displayToast("ส่งคำขอแล้ว");
                setSelectedEmpForRequest("");
                setSelectedProjects([]);
                setRequestDays(1);
                setStartDate("");
                e.target.reset();
            };
            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto pb-20 animate-in">
                        <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-6">
                            <div>
                                <div className="flex items-center gap-3">
                                    <Icon name="Calendar" className="w-8 h-8 text-indigo-700" />
                                    <h1 className="text-3xl font-black text-indigo-700 tracking-tight"><EditableText id="appTitle" /></h1>
                                    {isAdmin && (
                                        <span className="bg-emerald-500 text-white text-[10px] px-2 py-1 rounded shadow-sm font-bold animate-pulse flex items-center gap-1">
                                            <Icon name="ShieldCheck" className="w-3.5 h-3.5" /> ADMIN
                                        </span>
                                    )}
                                </div>
                                <p className="text-slate-500 text-sm mt-1 font-medium"><EditableText id="subTitle" /></p>
                            </div>
                            <div className="flex items-center gap-3 font-bold">
                                <nav className="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 overflow-x-auto no-scrollbar">
                                    <button onClick={() => { setActiveTab('dashboard'); setSelectedUserDetail(null); }} className={`px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 shrink-0 ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Icon name="LayoutDashboard" className="w-4 h-4" /> <EditableText id="tabDashboard" /></button>
                                    <button onClick={() => { setActiveTab('history'); setSelectedUserDetail(null); }} className={`px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 shrink-0 ${activeTab === 'history' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Icon name="History" className="w-4 h-4" /> <EditableText id="tabHistory" /></button>
                                    <button onClick={() => { setActiveTab('request'); setSelectedUserDetail(null); }} className={`px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 shrink-0 ${activeTab === 'request' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Icon name="FileText" className="w-4 h-4" /> <EditableText id="tabRequest" /></button>
                                    {isAdmin && <button onClick={() => { setActiveTab('manage'); setSelectedUserDetail(null); }} className={`px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 shrink-0 ${activeTab === 'manage' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}><Icon name="Settings" className="w-4 h-4" /> <EditableText id="tabManage" /></button>}
                                </nav>
                                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLoginModal(true)} className={`p-2.5 rounded-xl border transition-all ${isAdmin ? 'bg-indigo-50 border-indigo-200 text-indigo-600' : 'bg-white border-slate-200 text-slate-400'}`}>{isAdmin ? <Icon name="Unlock" className="w-5 h-5" /> : <Icon name="Lock" className="w-5 h-5" />}</button>
                            </div>
                        </header>
                        <main>
                            {/* Dashboard */}
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    {!selectedUserDetail ? (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 font-bold text-center">

                                                        <div className="flex justify-between mb-1">
                                                            <span className="font-black">{employees.find(e => e.id === log.empId)?.name}</span>
                                                            <span className="text-[10px] font-mono text-slate-400 bg-white px-2 py-1 rounded-lg">{log.date}</span>
                                                        </div>
                                                        <div className="text-sm text-amber-800 mb-1 font-black">{log.daysUsed} วัน</div>
                                                        <div className="text-[10px] text-amber-600 mb-2 italic">หักจาก: {log.sourceProjectName}</div>
                                                        {log.note && <div className="text-[10px] text-slate-500 mb-2 italic">"{log.note}"</div>}
                                                        <div className="flex gap-2">
                                                            <button onClick={() => { setUsageLogs(prev => prev.map(l => l.id === log.id ? { ...l, status: 'Approved' } : l)); displayToast("อนุมัติแล้ว"); }} className="flex-1 bg-emerald-600 text-white py-2 rounded-xl text-xs font-black shadow-md hover:bg-emerald-700 active:scale-95 transition-all">ยืนยัน</button>
                                                            <button onClick={() => { setUsageLogs(prev => prev.map(l => l.id === log.id ? { ...l, status: 'Rejected' } : l)); displayToast("ปฏิเสธแล้ว"); }} className="flex-1 bg-white border border-slate-200 text-slate-400 py-2 rounded-xl text-xs font-black hover:bg-slate-50 active:scale-95 transition-all">ปฏิเสธ</button>
                                                        </div>
                                                    </div>
                                                ))}
                                                {usageLogs.filter(l => l.status === 'Pending').length === 0 && (
                                                    <p className="text-center py-12 text-slate-300 italic font-black">ไม่มีรายการค้างตรวจสอบ</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    {/* Security */}
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-rose-100 max-w-2xl mx-auto font-bold text-slate-800">
                                        <h2 className="text-xl font-black mb-6 flex items-center gap-3 text-rose-600"><Icon name="KeyRound" className="w-5 h-5 text-rose-600" /> {uiLabels.manageSectionSecurity}</h2>
                                        <form onSubmit={handlePassChange} className="space-y-4 font-black">
                                            <input name="oldPass" type="password" required maxLength={4} className="w-full p-4 rounded-2xl border-2 border-slate-100 outline-none focus:border-rose-500 transition-all shadow-inner font-bold" placeholder={uiLabels.labelOldPass} />
                                            <input name="newPass" type="password" required maxLength={4} className="w-full p-4 rounded-2xl border-2 border-slate-100 outline-none focus:border-rose-500 transition-all shadow-inner font-bold" placeholder={uiLabels.labelNewPass} />
                                            <input name="confirmPass" type="password" required maxLength={4} className="w-full p-4 rounded-2xl border-2 border-slate-100 outline-none focus:border-rose-500 transition-all shadow-inner font-bold" placeholder={uiLabels.labelConfirmPass} />
                                            <button type="submit" className="w-full bg-rose-500 text-white py-4 rounded-2xl font-black shadow-lg shadow-rose-100 active:scale-95 transition-all hover:bg-rose-600">{uiLabels.btnChangePass}</button>
                                        </form>
                                    </div>
                                    {/* Team Management */}
                                    <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 max-w-2xl mx-auto font-bold text-slate-800">
                                        <h2 className="text-xl font-black mb-6 flex items-center gap-3 text-slate-700"><Icon name="UserPlus" className="w-5 h-5 text-slate-700" /> {uiLabels.manageSectionTeam}</h2>
                                        <form onSubmit={(e) => { e.preventDefault(); const n = e.target.empName.value.trim(); if (n) { setEmployees(prev => [...prev, { id: Date.now(), name: n }]); e.target.reset(); displayToast(`เพิ่มคุณ ${n} แล้ว`); } }} className="flex gap-2 mb-6">
                                            <input name="empName" required placeholder={uiLabels.addMemberPlaceholder} className="flex-1 p-4 rounded-2xl border-2 border-slate-100 outline-none focus:border-indigo-500 transition-all shadow-inner font-bold" />
                                            <button className="bg-slate-800 text-white px-8 rounded-2xl font-black shadow-lg active:scale-95 hover:bg-slate-900 transition-all"><Icon name="Plus" className="w-4 h-4" /></button>
                                        </form>
                                        <div className="space-y-2 font-black">
                                            {employees.map(emp => (
                                                <div key={emp.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 group transition-all hover:bg-white hover:shadow-md">
                                                    <span>{emp.name}</span>
                                                    <button onClick={() => { if (window.confirm(`ลบ "${emp.name}" ออกจากทีม?\nข้อมูลสิทธิ์และประวัติจะยังคงอยู่`)) setEmployees(prev => prev.filter(x => x.id !== emp.id)); }} className="text-slate-300 hover:text-rose-500 p-2 opacity-0 group-hover:opacity-100 transition-all">
                                                        <Icon name="UserMinus" className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                        {/* Login Modal */}
                        {showLoginModal && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-[100] p-4 animate-in">
                                <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-sm shadow-2xl text-center border border-slate-200 font-bold">
                                    <div className="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-inner animate-bounce">
                                        <Icon name="Lock" className="w-8 h-8 text-indigo-600" />
                                    </div>
                                    <h3 className="text-2xl font-black mb-6 tracking-tight text-indigo-700 uppercase">Admin Login</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); if (passwordInput === adminPassword) { setIsAdmin(true); setShowLoginModal(false); setPasswordInput(''); displayToast("ยินดีต้อนรับ แอดมิน"); } else { displayToast("รหัสไม่ถูกต้อง"); } }} className="space-y-4 font-black">
                                        <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full p-4 rounded-2xl border-2 border-slate-100 text-center text-3xl font-black tracking-[1em] outline-none focus:border-indigo-500 transition-all shadow-inner" placeholder="••••" autoFocus maxLength={4} />
                                        <button type="submit" className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all shadow-indigo-100 hover:bg-indigo-700">SIGN IN</button>
                                    </form>
                                    <button onClick={() => { setShowLoginModal(false); setPasswordInput(''); }} className="text-slate-400 text-xs mt-6 font-bold hover:text-slate-600 transition-colors uppercase tracking-widest">Cancel</button>
                                </div>
                            </div>
                        )}
                        {/* Toast */}
                        {showToast && (
                            <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-3 z-50 border border-slate-700 animate-in font-bold">
                                <Icon name="CheckCircle" className="w-5 h-5 text-emerald-400 shrink-0" />
                                {showToast}
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
